<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Carpet Reveal · 红毯亮相</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  :root {
    --c3-black: #0b0a0f; --c3-plum: #2a1626; --c3-pink: #f4a6c6; --c3-pink2: #e889b0;
    --c3-gold: #d9b892; --c3-gold2: #a8825f; --c3-cream: #f6efe9;
    --c3-glass: rgba(38, 20, 36, .72); --c3-line: rgba(255, 255, 255, .12);
    --c3-sans: var(--f-sans, "DM Sans", system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    --c3-serif: var(--f-serif, "Playfair Display", Georgia, "Times New Roman", serif);
    --c3-script: var(--f-script, "Great Vibes", "Brush Script MT", "Segoe Script", cursive);
  }
  #c3 { position: absolute; inset: 0; pointer-events: none; font-family: var(--c3-sans); color: var(--c3-cream); }
  #c3.off > *:not(.keep) { opacity: 0; pointer-events: none !important; }
  #c3 > * { transition: opacity .3s; }
  .pe { pointer-events: auto; }
  .c3-glass { background: var(--c3-glass); border: 1px solid var(--c3-line); border-radius: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .c3-shadow { text-shadow: 0 1px 6px rgba(0,0,0,.65); }

  /* timer (kit top bar owns y 0-70) */
  .c3-timer { position: absolute; left: 12px; top: 146px; height: 30px; width: 74px; padding: 0 12px 0 8px; display: flex; align-items: center; gap: 7px;
    border-radius: 16px; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
  .c3-timer i { width: 18px; height: 18px; border-radius: 50%; flex: none;
    background: conic-gradient(var(--c3-gold) calc(var(--p, 1) * 1turn), rgba(255,255,255,.14) 0); box-shadow: 0 0 8px rgba(217,184,146,.4); }
  .c3-timer.warn { color: #ffb3c9; border-color: rgba(255,92,138,.75); animation: c3-pulse .5s infinite alternate; }
  .c3-timer.warn i { background: conic-gradient(#ff5c8a calc(var(--p, 1) * 1turn), rgba(255,255,255,.14) 0); }

  /* brief */
  .c3-brief { position: absolute; left: 12px; right: 12px; top: 76px; padding: 7px 12px 8px; }
  .c3-brief .h { font-size: 9.5px; letter-spacing: 2px; color: var(--c3-gold); text-transform: uppercase; font-weight: 800; }
  .c3-brief .n { font-family: var(--c3-serif); font-style: italic; font-size: 15px; margin: 1px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c3-brief .n small { font-style: normal; font-family: var(--c3-sans); font-size: 10.5px; color: rgba(246,239,233,.55); margin-left: 6px; }
  .bchips { display: flex; gap: 5px; flex-wrap: wrap; }
  .bchip { font-size: 11.5px; font-weight: 800; padding: 3px 9px 3px 8px; border-radius: 999px; border: 1px solid rgba(217,184,146,.5);
    background: rgba(217,184,146,.1); color: var(--c3-cream); transition: background .25s, color .25s; white-space: nowrap; }
  .bchip small { font-weight: 400; opacity: .65; margin-left: 3px; font-size: 10px; }
  .bchip.ok { background: linear-gradient(135deg, var(--c3-gold), var(--c3-gold2)); color: #1a1018; border-color: transparent; }
  .bchip.ok::before { content: '✓ '; }
  .bchip.hint { box-shadow: 0 0 0 1px var(--c3-pink), 0 0 10px rgba(244,166,198,.6); }
  .bchip.secret { border-style: dashed; border-color: rgba(244,166,198,.75); color: var(--c3-pink); background: rgba(244,166,198,.08); }
  .bchip.secret.ok { background: linear-gradient(135deg, var(--c3-pink), var(--c3-pink2)); color: var(--c3-plum); border-style: solid; }
  .bchip.secret.ok::before { content: '♥ '; }
  .bchip.warn { border-color: rgba(255,120,140,.75); color: #ffb0bf; background: rgba(255,80,110,.12); }
  .bchip.pop { animation: c3-chip .55s cubic-bezier(.2,.9,.3,1.4); }

  /* score meter */
  .c3-meter { position: absolute; left: 92px; right: 12px; top: 146px; height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 15px; }
  .c3-meter .sc { font-weight: 900; font-size: 16px; min-width: 30px; font-variant-numeric: tabular-nums; }
  .c3-meter .sc small { display: block; font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; color: rgba(246,239,233,.55); margin-top: -2px; }
  .c3-meter .bar { position: relative; flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); }
  .c3-meter .fill, .c3-meter .ghost { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transition: width .4s cubic-bezier(.2,.9,.3,1.2); }
  .c3-meter .fill { background: linear-gradient(90deg, var(--c3-pink2), var(--c3-pink), var(--c3-gold)); box-shadow: 0 0 10px rgba(244,166,198,.6); }
  .c3-meter .ghost { background: repeating-linear-gradient(45deg, rgba(217,184,146,.6) 0 4px, rgba(217,184,146,.18) 4px 8px); }
  .c3-meter .st { position: absolute; top: 50%; transform: translate(-50%, -54%); font-size: 15px; color: rgba(255,255,255,.3); transition: color .25s; text-shadow: 0 1px 3px #000; }
  .c3-meter .st.on { color: var(--c3-gold); text-shadow: 0 0 8px rgba(217,184,146,.95); animation: c3-chip .5s; }
  .c3-meter .need { font-size: 10.5px; min-width: 62px; text-align: right; color: rgba(246,239,233,.8); line-height: 1.15; }
  .c3-meter .need b { color: var(--c3-gold); }

  /* premium try-on bar */
  .c3-trial { position: absolute; left: 12px; right: 12px; top: 182px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 5px 0 12px;
    border-color: rgba(217,184,146,.55); opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; }
  .c3-trial.show { opacity: 1; transform: none; pointer-events: auto; }
  .c3-trial .tx { flex: 1; font-size: 11.5px; line-height: 1.25; }
  .c3-trial .tx b { color: var(--c3-gold); }
  .c3-trial .tx small { display: block; opacity: .6; font-size: 10px; }
  .c3-gold { border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--c3-gold), var(--c3-gold2)); color: #1a1018;
    font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 4px 16px rgba(217,184,146,.35); transition: transform .1s, filter .15s; }
  .c3-gold:hover { filter: brightness(1.08); }
  .c3-gold:active { transform: scale(.95); }
  .c3-trial .c3-gold { padding: 8px 12px; font-size: 12px; }

  /* character */
  .c3-char { position: absolute; left: 52px; top: 204px; width: 171px; height: 310px; transform-origin: 50% 100%; }
  .c3-char svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 12px 18px rgba(0,0,0,.5)); }
  .c3-char.bounce { animation: c3-bounce .5s cubic-bezier(.2,.9,.3,1.3); }
  .c3-char.shake { animation: c3-shake .38s; }
  .ly.fresh { animation: c3-layer .5s cubic-bezier(.2,.9,.3,1.3); transform-box: fill-box; transform-origin: 50% 40%; }

  /* Jace's bubble + finish button */
  .c3-bubble { position: absolute; left: 234px; top: 232px; width: 142px; padding: 8px 11px 9px; font-size: 12px; line-height: 1.35;
    border-radius: 16px 16px 16px 4px; opacity: 0; transform: scale(.8) translateY(6px); transform-origin: 0 100%;
    transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.3); }
  .c3-bubble.show { opacity: 1; transform: none; }
  .c3-bubble .who { font-family: var(--c3-script); color: var(--c3-pink); font-size: 17px; line-height: 1; display: block; margin-bottom: 2px; }
  .c3-bubble .line { display: block; }
  .c3-done { position: absolute; right: 12px; top: 454px; width: 126px; height: 50px; font-size: 14.5px; line-height: 1.1; pointer-events: auto; }
  .c3-done small { display: block; font-size: 10px; font-weight: 600; opacity: .7; }
  .c3-done.ready { animation: c3-glow 1.2s infinite alternate; }

  /* bottom wardrobe panel */
  .c3-panel { position: absolute; left: 0; right: 0; top: 512px; bottom: 0; pointer-events: auto; padding: 8px 10px;
    background: linear-gradient(180deg, rgba(42,22,38,.9), rgba(14,9,14,.97)); border-top: 1px solid var(--c3-line);
    border-radius: 22px 22px 0 0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
  .c3-tabs { display: flex; gap: 4px; }
  .c3-tab { flex: 1; position: relative; height: 40px; border: 0; border-radius: 12px; background: transparent; color: rgba(246,239,233,.55);
    font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; line-height: 1.05; transition: background .2s, color .2s; }
  .c3-tab small { display: block; font-weight: 400; font-size: 9.5px; opacity: .75; margin-top: 2px; }
  .c3-tab.on { background: rgba(244,166,198,.14); color: var(--c3-cream); box-shadow: inset 0 0 0 1px rgba(244,166,198,.6); }
  .c3-tab .dot { position: absolute; top: 4px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--c3-pink);
    box-shadow: 0 0 8px var(--c3-pink); animation: c3-pulse .6s infinite alternate; }
  .c3-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
  .c3-card { position: relative; height: 100px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05);
    color: var(--c3-cream); font: inherit; padding: 5px 6px 6px; cursor: pointer; text-align: left; display: flex; flex-direction: column;
    transition: transform .12s, border-color .2s, background .2s; overflow: hidden; }
  .c3-card:hover { background: rgba(255,255,255,.08); }
  .c3-card:active { transform: scale(.95); }
  .c3-card .ic { height: 44px; display: flex; justify-content: center; }
  .c3-card .ic svg { height: 44px; width: 60px; }
  .c3-card .nm { font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .c3-card .nm small { font-weight: 400; font-size: 9.5px; opacity: .55; margin-left: 3px; }
  .c3-card .tg { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
  .c3-chip { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 999px; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14); color: rgba(246,239,233,.85); white-space: nowrap; }
  .c3-chip.match { background: rgba(217,184,146,.24); border-color: var(--c3-gold); color: #f6dfbd; box-shadow: 0 0 6px rgba(217,184,146,.5); }
  .c3-chip.clash { border-color: rgba(255,110,130,.75); color: #ff9aac; background: rgba(255,80,110,.12); }
  .c3-chip.clash::before { content: '✕ '; font-size: 8px; }
  .c3-chip.adapt { border-color: rgba(217,184,146,.7); color: var(--c3-gold); background: rgba(217,184,146,.1); }
  .c3-chip.ours { border-color: var(--c3-pink); color: var(--c3-pink); background: rgba(244,166,198,.12); }
  .c3-card.on { border-color: var(--c3-pink); background: rgba(244,166,198,.13); box-shadow: 0 0 0 1px var(--c3-pink), 0 6px 18px rgba(232,137,176,.25); }
  .c3-card.on::after { content: '✓'; position: absolute; left: 5px; top: 5px; width: 17px; height: 17px; border-radius: 50%; background: var(--c3-pink);
    color: var(--c3-plum); font-size: 10.5px; font-weight: 900; display: grid; place-items: center; }
  .c3-card.pop { animation: c3-cardpop .4s cubic-bezier(.2,.9,.3,1.5); }
  .c3-card.focus { outline: 2px dashed rgba(217,184,146,.85); outline-offset: 1px; }
  .c3-card.prem { border-color: rgba(217,184,146,.45); background: linear-gradient(160deg, rgba(217,184,146,.16), rgba(255,255,255,.03)); }
  .c3-card .gem { position: absolute; right: 4px; top: 4px; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 999px;
    background: linear-gradient(135deg, var(--c3-gold), var(--c3-gold2)); color: #1a1018; }
  .c3-card .gem.owned { background: rgba(217,184,146,.22); color: var(--c3-gold); }

  @keyframes c3-pulse { to { opacity: .55; } }
  @keyframes c3-chip { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: none; } }
  @keyframes c3-cardpop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } }
  @keyframes c3-bounce { 0% { transform: scale(1, 1); } 30% { transform: scale(1.04, .95); } 60% { transform: scale(.98, 1.03); } 100% { transform: none; } }
  @keyframes c3-shake { 20% { transform: translateX(-6px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  @keyframes c3-layer { 0% { opacity: 0; transform: translateY(-10px) scale(1.08); } 100% { opacity: 1; transform: none; } }
  @keyframes c3-glow { to { box-shadow: 0 0 0 3px rgba(244,166,198,.45), 0 0 26px rgba(217,184,146,.75); } }

  /* flash-moment reveal */
  .c3-rv { position: absolute; inset: 0; overflow: hidden; background: var(--c3-black); display: none; }
  .c3-rv.show { display: block; animation: kit-fade .3s; }
  .c3-rv canvas { position: absolute; left: 0; top: 0; width: 390px; height: 780px; }
  .rv-char { position: absolute; left: 92px; top: 236px; width: 206px; height: 374px; transform-origin: 50% 100%; opacity: 0; }
  .rv-char.walk { animation: rv-walk 2.4s cubic-bezier(.25,.8,.3,1) forwards; }
  .rv-char.walk > div { animation: rv-bob .42s ease-in-out 5 alternate; }
  .rv-char.pose > div { animation: rv-pose .6s cubic-bezier(.2,.9,.3,1.4); }
  .rv-char svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 18px rgba(255,236,210,.18)) drop-shadow(0 16px 20px rgba(0,0,0,.6)); }
  .rv-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .rv-flash.on { animation: rv-flash .28s ease-out; }
  .rv-cap { position: absolute; left: 0; right: 0; top: 74px; text-align: center; }
  .rv-cap span { font-family: var(--c3-script); color: var(--c3-pink); font-size: 34px; text-shadow: 0 2px 16px rgba(232,137,176,.7); }
  .rv-cap small { display: block; font-size: 10px; letter-spacing: 4px; color: rgba(246,239,233,.7); margin-top: 2px; }
  .rv-dm { position: absolute; inset: 0; pointer-events: none; }
  .dm { position: absolute; left: 390px; white-space: nowrap; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(38,20,36,.6); border: 1px solid rgba(255,255,255,.12); color: var(--c3-cream); text-shadow: 0 1px 4px rgba(0,0,0,.7);
    animation: rv-dm 4.6s linear forwards; }
  .dm.good { border-color: rgba(217,184,146,.45); }
  .dm.star { background: linear-gradient(135deg, rgba(217,184,146,.9), rgba(168,130,95,.9)); color: #1a1018; text-shadow: none; }
  .dm.love { border-color: var(--c3-pink); color: #ffd3e4; }
  .dm.love::before { content: '♥ '; color: var(--c3-pink); }
  .dm.meh { color: rgba(246,239,233,.72); }
  .rv-stars { position: absolute; left: 50%; bottom: 112px; width: 300px; margin-left: -150px; padding: 12px 16px 14px; text-align: center; opacity: 0; transform: translateY(20px); transition: opacity .35s, transform .45s cubic-bezier(.2,.9,.3,1.3); }
  .rv-stars.show { opacity: 1; transform: none; }
  .rv-stars .s { font-size: 30px; letter-spacing: 6px; color: rgba(255,255,255,.2); }
  .rv-stars .s b { color: var(--c3-gold); text-shadow: 0 0 12px rgba(217,184,146,.9); font-weight: 400; }
  .rv-stars .v { font-family: var(--c3-serif); font-style: italic; font-size: 17px; margin-top: 2px; }
  .rv-stars .v small { display: block; font-family: var(--c3-sans); font-style: normal; font-size: 11px; opacity: .65; margin-top: 2px; }
  .rv-skip { position: absolute; left: 14px; bottom: 22px; border: 1px solid var(--c3-line); background: var(--c3-glass); color: var(--c3-cream);
    font: inherit; font-family: var(--c3-sans); font-size: 12px; padding: 7px 13px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px); }
  @keyframes rv-walk { 0% { opacity: 0; transform: translateY(150px) scale(.55); } 15% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes rv-bob { to { transform: translateY(-5px) rotate(.8deg); } }
  @keyframes rv-pose { 0% { transform: none; } 40% { transform: scale(1.04) rotate(-1.5deg); } 100% { transform: none; } }
  @keyframes rv-flash { 0% { opacity: .75; } 100% { opacity: 0; } }
  @keyframes rv-dm { to { transform: translateX(calc(-390px - 100%)); } }

  /* end card */
  .c3-end { text-align: center; }
  .c3-end h2 { font-family: var(--c3-script); color: #d6457d; font-size: 34px; font-weight: 400; margin: 8px 0 2px; }
  .c3-end p { font-family: var(--c3-serif); font-style: italic; color: #5c4f80; font-size: 14px; line-height: 1.55; margin: 6px 0 4px; }
  .c3-end p small { display: block; font-family: var(--c3-sans); font-style: normal; font-size: 11.5px; opacity: .8; }
</style>
</head>
<body>
<script src="../kit/kit.js"></script>
<script src="../kit/wallet.js"></script>
<script src="../kit/frame.js"></script>
<script src="data.js"></script>
<script src="score.js"></script>
<script src="art.js"></script>
<script src="reveal.js"></script>
<script src="game.js"></script>
</body>
</html>
